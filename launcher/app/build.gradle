plugins {
    id 'com.android.application'
}

// Keys for the recommendations hero (Recs), from work/recs.properties at the repository root: git ignores work/,
// so they reach the APK without entering the repo. Missing keys leave them empty and the hero off.
def recsProps = new Properties()
def recsFile = rootProject.file('../work/recs.properties')
if (recsFile.exists()) recsFile.withInputStream { recsProps.load(it) }

android {
    namespace 'com.kermes.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.kermes.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '2.7'
        buildConfigField 'String', 'TMDB_TOKEN', "\"${recsProps.getProperty('tmdb_token', '').trim()}\""
        buildConfigField 'String', 'OMDB_KEY', "\"${recsProps.getProperty('omdb_key', '').trim()}\""
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
